openapi: 3.0.0
info:
  title: DIGIPIN API
  description: Encode and decode DIGIPIN based on latitude and longitude
  version: 1.0.0
servers:
  - url: http://localhost:5000/api

components:
  schemas:
    EncodeRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          oneOf:
            - type: number
            - type: string
          example: 12.9716
        longitude:
          oneOf:
            - type: number
            - type: string
          example: 77.5946
    EncodeResponse:
      type: object
      properties:
        digipin:
          type: string
          example: 4P3-JK8-52C9
    DecodeRequest:
      type: object
      required:
        - digipin
      properties:
        digipin:
          type: string
          example: 4P3-JK8-52C9
    DecodeResponse:
      type: object
      properties:
        latitude:
          type: string
          example: "12.971601"
        longitude:
          type: string
          example: "77.594584"
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Latitude must be a valid number

paths:
  /digipin/encode:
    post:
      summary: Encode lat/lon into DIGIPIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncodeRequest'
      responses:
        '200':
          description: Successfully encoded DIGIPIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncodeResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Encode latitude and longitude into DIGIPIN
      parameters:
        - in: query
          name: latitude
          required: true
          schema:
            oneOf:
              - type: number
              - type: string
        - in: query
          name: longitude
          required: true
          schema:
            oneOf:
              - type: number
              - type: string
      responses:
        '200':
          description: Successfully encoded DIGIPIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncodeResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /digipin/decode:
    post:
      summary: Decode DIGIPIN to coordinates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecodeRequest'
      responses:
        '200':
          description: Successfully decoded DIGIPIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecodeResponse'
        '400':
          description: Invalid DIGIPIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Decode DIGIPIN to coordinates
      parameters:
        - in: query
          name: digipin
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully decoded DIGIPIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecodeResponse'
        '400':
          description: Invalid DIGIPIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
